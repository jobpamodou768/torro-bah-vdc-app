
name: Build Torro Bah VDC Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "torro-bah-vdc-app",
            "version": "1.0.0",
            "private": true
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.torrobah.vdc",
            "appName": "Torro Bah VDC Management",
            "webDir": "www"
          }
          EOF

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Torro-Bah-VDC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
